name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RUN_HPT: "false"   # Disable Optuna / heavy training in CI

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 3️⃣ Upgrade pip tooling
      - name: Upgrade pip, setuptools, wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 4️⃣ Install project dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 5️⃣ Sanity import check (fails fast if deps broken)
      - name: Verify core imports
        run: |
          python - <<EOF
          import fastapi
          import uvicorn
          import pandas
          import numpy
          import sklearn
          import lightgbm
          import mlflow
          import optuna
          import redis
          print("✅ All core imports successful")
          EOF

      # 6️⃣ Run test suite
      - name: Run tests
        run: |
          pytest -v --maxfail=1

      # 7️⃣ CI success marker
      - name: CI completed successfully
        run: echo "✅ CI pipeline finished successfully"
